name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Copy synced docs into build output
        run: |
          for dir in lumen module-sdk community-modules lumen-locales rust; do
            if [ -d "$dir" ]; then
              mkdir -p "dist/$dir"
              cp -r "$dir/." "dist/$dir/"
            fi
          done

      - name: Generate crate index redirects
        run: |
          shopt -s nullglob
          for repo_dir in dist/rust/*/; do
            [ -d "$repo_dir" ] || continue
            [ -f "${repo_dir}index.html" ] && continue
            crate=$(find "$repo_dir" -mindepth 2 -maxdepth 2 -name index.html | sort | head -n1)
            [ -n "$crate" ] || continue
            crate_name=$(basename "$(dirname "$crate")")
            cat > "${repo_dir}index.html" <<EOF
          <!DOCTYPE html>
          <html><head><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=./${crate_name}/"><title>Redirecting</title></head>
          <body>Redirecting to <a href="./${crate_name}/">${crate_name}</a>...</body></html>
          EOF
          done

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4